# Café Cloud — infraestructura de datos (TICKET-001), `orders-service`
# (TICKET-002), su publicador de outbox (TICKET-004), `processor-service`
# (TICKET-005), `notifier-service` (TICKET-006) y `cleanup-job` (TICKET-008).
#
# Los almacenes son Postgres, Redis y Mongo.
#
# Arranca sin configurar nada: todas las variables tienen valor por defecto de
# desarrollo. Para cambiarlas, copiar `.env.example` a `.env` y editarlo.
#
#   docker compose up -d --build
#
name: cafecloud

# Imagen y entorno compartidos por `orders-service`, `orders-migrate` y
# `orders-outbox-publisher`: el mismo artefacto ejecutando tres procesos.
x-orders-image: &orders-image
  build:
    context: ./orders-service
    dockerfile: Dockerfile
    target: runtime
  image: cafecloud/orders-service:0.1.0

# Imagen y entorno compartidos por `processor-migrate`, `processor-service` y
# `processor-outbox-publisher`: el mismo artefacto ejecutando tres procesos.
x-processor-image: &processor-image
  build:
    context: ./processor-service
    dockerfile: Dockerfile
    target: runtime
  image: cafecloud/processor-service:0.1.0

x-processor-env: &processor-env
  # Rol propio, `processor_rw`: dueño del esquema `processor` y con permiso
  # únicamente de SELECT y UPDATE de tres columnas sobre `orders.orders`
  # (ADR-006). El límite lo impone Postgres, no el código.
  DATABASE_URL: postgresql+asyncpg://${PROCESSOR_DB_USER:-processor_rw}:${PROCESSOR_DB_PASSWORD:-processor_dev_pw}@postgres:5432/${POSTGRES_DB:-cafecloud}
  REDIS_URL: redis://redis:6379/${PROCESSOR_REDIS_DB:-0}
  SERVICE_NAME: ${PROCESSOR_SERVICE_NAME:-processor-service}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Imagen compartida por `notifier-service` y `notifier-consumer`: el mismo
# artefacto ejecutando dos procesos (TICKET-006, decisión 2).
x-notifier-image: &notifier-image
  build:
    context: ./notifier-service
    dockerfile: Dockerfile
    target: runtime
  image: cafecloud/notifier-service:0.1.0

x-notifier-env: &notifier-env
  # Nodo único sin autenticación, así que la cadena no lleva credenciales. La
  # colección y sus índices los crea el init de Mongo; este servicio solo los
  # comprueba al arrancar (ADR-005, TICKET-001).
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: ${MONGO_DB:-cafecloud}
  REDIS_URL: redis://redis:6379/${NOTIFIER_REDIS_DB:-0}
  SERVICE_NAME: ${NOTIFIER_SERVICE_NAME:-notifier-service}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-orders-env: &orders-env
  # La cadena se compone aquí a partir del rol de aplicación: `orders_rw`, nunca
  # el superusuario (TICKET-002, decisión 4). El host es siempre `postgres`,
  # el nombre del servicio en la red del proyecto.
  DATABASE_URL: postgresql+asyncpg://${ORDERS_DB_USER:-orders_rw}:${ORDERS_DB_PASSWORD:-orders_dev_pw}@postgres:5432/${POSTGRES_DB:-cafecloud}
  REDIS_URL: redis://redis:6379/${ORDERS_REDIS_DB:-0}
  SERVICE_NAME: ${ORDERS_SERVICE_NAME:-orders-service}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # La migración 0001 concede sobre este rol; si se cambia el nombre, el GRANT lo sigue.
  PROCESSOR_DB_USER: ${PROCESSOR_DB_USER:-processor_rw}

services:
  # ---------------------------------------------------------------------------
  # Postgres 16 — pedidos (esquema `orders`) y estado del procesador
  # (esquema `processor`). Los esquemas y los roles los crea el script de
  # init `infra/postgres/init/01-schemas-roles.sql`, que el entrypoint oficial
  # ejecuta una única vez, cuando el volumen de datos está vacío.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cafecloud-postgres
    restart: unless-stopped
    environment:
      # Superusuario del contenedor. Las aplicaciones NO lo usan: cada servicio
      # entra con su propio rol (ADR-006).
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cafecloud}
      # Roles de aplicación. El script de init los lee con `\getenv`, de modo
      # que ninguna contraseña queda escrita en el SQL ni en la imagen.
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders_rw}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev_pw}
      PROCESSOR_DB_USER: ${PROCESSOR_DB_USER:-processor_rw}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:-processor_dev_pw}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-h 127.0.0.1` no es decorativo: durante la inicialización el entrypoint
      # levanta un servidor temporal con `listen_addresses=''` que SÍ acepta
      # conexiones por el socket Unix. Un `pg_isready` sin `-h` lo encontraría y
      # marcaría el contenedor `healthy` mientras el script de init todavía se
      # está ejecutando. Comprobando el puerto TCP, `healthy` significa lo único
      # que sirve: init terminado y servidor real aceptando clientes. De eso
      # depende el `depends_on: condition: service_healthy` de TICKET-002.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — broker de eventos (Redis Streams, ADR-001).
  # AOF obligatorio con fsync cada segundo: sin esto, un reinicio se lleva por
  # delante los streams y la Pending Entries List.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cafecloud-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MongoDB 7 — notificaciones (ADR-005).
  # La colección y sus tres índices los crea
  # `infra/mongo/init/01-notifications-indexes.js`, que el entrypoint ejecuta
  # una sola vez contra la base `MONGO_INITDB_DATABASE`.
  # Nodo único, sin replica set y sin autenticación: entorno de desarrollo.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: cafecloud-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cafecloud}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # No basta con el ping (TICKET-001, pendiente 7): el entrypoint levanta un
      # `mongod` temporal en 127.0.0.1 mientras corren los scripts de init, y el
      # healthcheck corre dentro del contenedor, así que un ping respondería
      # `healthy` con la colección todavía sin crear. `notifier-service` cuelga
      # de este healthcheck y se niega a arrancar sin el índice único, de modo
      # que la carrera se traduciría en arranques fallidos. Se afirma sobre el
      # estado real del init: los tres índices de ADR-005 más `_id_`. Si la
      # colección no existe, `getIndexes()` lanza y el healthcheck falla.
      test:
        - CMD-SHELL
        - 'mongosh "$$MONGO_INITDB_DATABASE" --quiet --eval "db.notifications.getIndexes().length >= 4" | grep -q true'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Migraciones del esquema `orders` (Alembic). Contenedor de un solo uso:
  # ejecuta `alembic upgrade head` y termina; `orders-service` no arranca hasta
  # que este contenedor sale con código 0 (TICKET-002, decisión 2).
  # Corre con `orders_rw`, el rol dueño del esquema, y necesita el mismo bloque
  # de entorno que el servicio porque `alembic/env.py` reutiliza `Settings`.
  # ---------------------------------------------------------------------------
  orders-migrate:
    <<: *orders-image
    container_name: cafecloud-orders-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *orders-env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # orders-service — API de pedidos (FastAPI sobre uvicorn).
  # ---------------------------------------------------------------------------
  orders-service:
    <<: *orders-image
    container_name: cafecloud-orders-service
    restart: unless-stopped
    environment:
      <<: *orders-env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ORDERS_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Sin `curl` en la imagen final: se comprueba con el intérprete que ya está dentro.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Publicador de outbox — saca los eventos de `orders.outbox` al stream
  # `orders.created` de Redis (ADR-002, TICKET-004). Misma imagen que la API,
  # otro proceso: el bucle de polling no compite con el event loop de uvicorn.
  # ---------------------------------------------------------------------------
  orders-outbox-publisher:
    <<: *orders-image
    container_name: cafecloud-orders-outbox-publisher
    restart: unless-stopped
    command: ["python", "-m", "app.publisher"]
    environment:
      <<: *orders-env
      SERVICE_NAME: ${ORDERS_PUBLISHER_SERVICE_NAME:-orders-outbox-publisher}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
    # Una sola réplica, y no es un detalle de despliegue: el orden global del
    # stream solo se conserva con un único publicador (ADR-002). Con dos, el
    # `FOR UPDATE SKIP LOCKED` reparte las filas y `orders.created` deja de ser
    # FIFO; conservarlo exigiría particionar por `aggregate_id`. El
    # `container_name` de arriba es la red de seguridad: con él, Compose se
    # niega a escalar el servicio y avisa en lugar de levantar un segundo.
    deploy:
      replicas: 1
    # SIGTERM corta el bucle al terminar el ciclo en curso; el margen cubre un
    # ciclo con un lote completo por publicar.
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Migraciones del esquema `processor` (Alembic). Cadena propia, contenedor de
  # un solo uso y rol propio: `processor_rw` es el dueño del esquema, así que sus
  # tablas nacen suyas (ADR-006). Es la segunda cadena del proyecto; `make
  # migrate` ejecuta las dos.
  # ---------------------------------------------------------------------------
  processor-migrate:
    <<: *processor-image
    container_name: cafecloud-processor-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *processor-env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # processor-service — consumidor de `orders.created` (TICKET-005). Lee con
  # XREADGROUP, simula la preparación, pasa el pedido a COMPLETED y encola
  # `orders.completed` en su outbox, todo en una transacción; el XACK va
  # después del commit.
  # ---------------------------------------------------------------------------
  processor-service:
    <<: *processor-image
    container_name: cafecloud-processor-service
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    environment:
      <<: *processor-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      processor-migrate:
        condition: service_completed_successfully
      # No es una dependencia de arranque cualquiera: los GRANT de ADR-006 sobre
      # `orders.orders` se conceden dentro de la migración 0001 de orders-service,
      # así que sin ella este servicio arrancaría sin permiso para completar nada.
      orders-migrate:
        condition: service_completed_successfully
    # Sin healthcheck: no expone HTTP todavía. El /health de los tres servicios
    # es TICKET-009.
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Publicador de outbox de processor-service — saca los eventos de
  # `processor.outbox` al stream `orders.completed` (ADR-002, TICKET-005).
  # Mismo diseño y mismo código que el de orders-service, con otro repositorio.
  # ---------------------------------------------------------------------------
  processor-outbox-publisher:
    <<: *processor-image
    container_name: cafecloud-processor-outbox-publisher
    restart: unless-stopped
    command: ["python", "-m", "app.publisher"]
    environment:
      <<: *processor-env
      SERVICE_NAME: ${PROCESSOR_PUBLISHER_SERVICE_NAME:-processor-outbox-publisher}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      processor-migrate:
        condition: service_completed_successfully
    # Una sola réplica, por el mismo motivo que en orders-service: el orden de
    # `orders.completed` solo se conserva con un único publicador (ADR-002).
    deploy:
      replicas: 1
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # notifier-service — API de consulta de notificaciones (FastAPI sobre uvicorn).
  # Solo lee Mongo; quien escribe es `notifier-consumer`. No toca Postgres nunca:
  # `orders.completed` es autosuficiente por contrato.
  # ---------------------------------------------------------------------------
  notifier-service:
    <<: *notifier-image
    container_name: cafecloud-notifier-service
    restart: unless-stopped
    environment:
      <<: *notifier-env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${NOTIFIER_SERVICE_PORT:-8003}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # Sin `curl` en la imagen final: se comprueba con el intérprete que ya está dentro.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # notifier-consumer — consumidor de `orders.completed` (TICKET-006). Lee con
  # XREADGROUP como grupo `notifier`, inserta el documento en `notifications` y
  # solo entonces hace XACK. La deduplicación es el índice único sobre
  # `event_id`: un DuplicateKeyError es éxito, no fallo (ADR-004, ADR-005).
  # Contenedor aparte de la API, con la misma imagen (TICKET-006, decisión 2).
  # ---------------------------------------------------------------------------
  notifier-consumer:
    <<: *notifier-image
    container_name: cafecloud-notifier-consumer
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    environment:
      <<: *notifier-env
      SERVICE_NAME: ${NOTIFIER_CONSUMER_SERVICE_NAME:-notifier-consumer}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # cleanup-job — borra cada minuto las notificaciones de más de 24 h
  # (TICKET-008). ADR-005 renuncia al índice TTL de Mongo a propósito, así que
  # el borrado es explícito y auditable: cada pasada deja una línea de log con
  # su `deleted_count`, también cuando vale cero.
  # Solo habla con Mongo: sin Postgres, sin Redis y sin puerto publicado.
  # Sin healthcheck: no es un servicio HTTP y no expone `/health`. El modo de un
  # solo disparo no sirve como sonda porque borra de verdad (TICKET-008,
  # decisión 2); la salud se lee en `docker compose logs cleanup-job`.
  # ---------------------------------------------------------------------------
  cleanup-job:
    build:
      context: ./cleanup-job
      dockerfile: Dockerfile
      target: runtime
    image: cafecloud/cleanup-job:0.1.0
    container_name: cafecloud-cleanup-job
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-cafecloud}
      SERVICE_NAME: ${CLEANUP_SERVICE_NAME:-cleanup-job}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      CLEANUP_RUN_ONCE: ${CLEANUP_RUN_ONCE:-false}
    depends_on:
      # El healthcheck de Mongo afirma sobre los índices del init, así que
      # esperar a que esté sano es esperar a que exista `ix_notifications_created_at`,
      # que es el índice del que vive el barrido (ADR-005).
      mongo:
        condition: service_healthy
    # SIGTERM apaga el planificador esperando a la pasada en vuelo; el margen
    # cubre un `delete_many` largo sobre una colección con mucho atraso.
    stop_grace_period: 30s

volumes:
  pgdata:
  redisdata:
  mongodata:
