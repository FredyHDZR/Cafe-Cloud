[tool.poetry]
name = "integration-tests"
version = "0.1.0"
description = "Cafe Cloud - pruebas de integracion del flujo completo"
authors = ["Cafe Cloud"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27,<1.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pymongo = ">=4.8,<5.0"
redis = ">=5.0,<7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.11,<3.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "B", "C4", "SIM", "PT", "TID", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# El codigo se monta de solo lectura desde el Compose.
cache_dir = "/tmp/pytest_cache"
